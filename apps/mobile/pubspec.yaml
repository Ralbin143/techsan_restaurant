name: techsan_restaurant
description: TechSan Restaurant - Waiter, Kitchen, Cashier Mobile App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  socket_io_client: ^3.0.2
  shared_preferences: ^2.3.4
  hive_flutter: ^1.1.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  mobile_scanner: ^6.0.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  go_router: ^14.6.2
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
