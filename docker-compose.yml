services:
  mongodb:
    image: mongo:7
    container_name: techsan_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: techsan_restaurant

  redis:
    image: redis:7-alpine
    container_name: techsan_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: techsan_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/techsan_restaurant
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./uploads:/app/uploads

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        # Browser must reach the API on the host (Next bakes this in at build time).
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: techsan_admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: techsan_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - admin

volumes:
  mongodb_data:
  redis_data:
